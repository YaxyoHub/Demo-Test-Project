<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    {% for i in books %}

    <p>{{ i.title }}</p>
    <p>{{ i.desc }}</p>
    <p>{{ i.owner.full_name }}</p>
    <p>{{ i.price }}</p>
    <p>{{ i.count }}</p>
    <p>{{ i.created_at }}</p>

    <hr>

    {% endfor %}
    
</body>
</html>
